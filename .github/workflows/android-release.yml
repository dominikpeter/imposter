name: Android release (Play Store)

# Builds a signed .aab and uploads it to the Play Console on a GitHub-hosted runner — nothing to install locally.
# Started by ci.yml after each release deploy (track: internal), or by hand ("Run workflow", pick the track).
#
# One-time setup:
#   1. Create a release keystore, once, and never lose it (Google can't re-issue it):
#        keytool -genkey -v -keystore imposter-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias imposter
#      Keep the .jks file itself somewhere safe outside git (e.g. your password manager); only its base64 goes
#      into GitHub. Then: base64 -i imposter-release.jks | pbcopy
#   2. Store them as GitHub secrets (each typed hidden, straight into `gh secret set`):
#        just secret-gh ANDROID_KEYSTORE_BASE64     output of the base64 command above
#        just secret-gh ANDROID_KEYSTORE_PASSWORD   the keystore password you chose
#        just secret-gh ANDROID_KEY_ALIAS           the -alias you chose (e.g. imposter)
#        just secret-gh ANDROID_KEY_PASSWORD        the key password (often the same as the keystore password)
#      then `gh variable set ANDROID_SIGNING_READY --body true`
#        just secret-gh PLAY_SERVICE_ACCOUNT_JSON   see step 3
#   3. Play Console → Setup → API access → create a service account (links to Google Cloud), grant it
#      "Release manager" access to this app, and download its JSON key — paste the whole file as the secret.
#   4. Create the app in Play Console by hand once, and upload one build through the console UI (Play
#      requires the very first release to go through the UI; the signed .aab from this workflow's artifacts works).
#      Then `gh variable set PLAY_PUBLISHING_READY --body true`, and every run uploads to the chosen track.
#
# Until ANDROID_SIGNING_READY is set, every run builds an unsigned bundle (proving the native project builds) and
# skips signing and the upload, so it's safe to run, and to start after every release, before the Play side is ready.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to publish to"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the native Android project (Capacitor)
        run: npx cap sync android

      - name: Decode the release keystore
        if: vars.ANDROID_SIGNING_READY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imposter-release.jks"

      - name: Build the app bundle (signed once ANDROID_SIGNING_READY is set, unsigned before)
        # Play rejects a re-used versionCode: 100 + the run number always goes up and stays clear of the
        # hand-uploaded first build (versionCode 1, setup step 4). versionName mirrors the web app's own
        # version (package.json). build.gradle reads both from the environment.
        env:
          # empty until signing is set up: build.gradle only signs when ANDROID_KEYSTORE_PATH is set
          ANDROID_KEYSTORE_PATH: ${{ vars.ANDROID_SIGNING_READY == 'true' && format('{0}/imposter-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ANDROID_VERSION_NAME=$(node -p "require('./package.json').version")
          export ANDROID_VERSION_NAME
          cd android
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Console
        if: vars.ANDROID_SIGNING_READY == 'true' && vars.PLAY_PUBLISHING_READY == 'true'
        # pinned to the commit behind v1: this third-party action gets the Play service account key
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.whoislying.imposter
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
