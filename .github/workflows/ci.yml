name: CI

# Git flow: work on `dev` → pull request into `main` (CI below + GitHub Copilot's code review, requested automatically) → merge.
# `main` is protected: it only moves through a pull request whose checks are green.
# A merge that bumps package.json's version is a release: this workflow then deploys it to Vercel, tags it and writes the
# GitHub release (notes from the merged pull requests), and starts the iOS build. Merges without a bump wait for the
# next release, so production (and the version shown in Settings) only ever changes with a release.
# Mirrors `just check` / `just e2e`, so CI runs the same thing a laptop does.
# One-time: `just vercel-ci-setup` (Vercel token + ids as secrets, sets VERCEL_CI_READY); until then the deploy skips.
on:
  push:
    branches: [main] # dev is covered by its pull request into main (`just pr`): one CI run per change, not two
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a release half way

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v3
      - run: npm ci
      - run: just lint typecheck test version-check
        env: { GH_TOKEN: "${{ github.token }}" } # version-check compares against the latest GitHub release

  e2e:
    needs: check
    # pinned: Playwright's --with-deps can lag a brand-new Ubuntu image; bump once it supports the next one
    runs-on: ubuntu-24.04
    env:
      # throwaway secret for the test servers only (dev + the production build the PWA tests run); no AI key, so the
      # real-AI specs skip themselves, and coffee/email run in their e2e modes (no Stripe, no mail)
      BETTER_AUTH_SECRET: ci-test-servers-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: just e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  # a push to main whose package.json version has no tag yet is a release
  release:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: release
    if: needs.release.outputs.new == 'true' && vars.VERCEL_CI_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # the tag and the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Tag and publish the GitHub release
        # the notes written for `just release` (the release pull request's description) on top, then GitHub's list of
        # the pull requests merged since the last release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          notes=$(gh pr list --state merged --base main --search "$GITHUB_SHA" --json body -q '.[0].body // ""')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "$notes" --generate-notes

  ios:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # ios-release.yml builds on its own macOS runner (signed + TestFlight once IOS_SIGNING_READY is set, an unsigned
      # build that proves the native project before that); this only starts it after a successful deploy.
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" --ref main
