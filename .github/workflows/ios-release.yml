name: iOS release (TestFlight)

# Builds and uploads the Capacitor iOS app to TestFlight on GitHub's own macOS runner (Xcode included) —
# nothing to install locally. Started by ci.yml after each release deploy, or by hand ("Run workflow").
#
# One-time setup (Apple Developer Program membership required, https://developer.apple.com/programs/):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API → generate a team key with the
#      "Admin" role (cloud-managed distribution signing needs it; an "App Manager" key can't create the
#      distribution certificate). Note the Key ID and Issuer ID, and download the .p8 file (shown only once).
#   2. Apple Developer → Membership → find your 10-character Team ID.
#   3. Store them as GitHub secrets (each typed hidden, straight into `gh secret set`):
#        just secret-gh APP_STORE_CONNECT_KEY_ID       the Key ID from step 1
#        just secret-gh APP_STORE_CONNECT_ISSUER_ID    the Issuer ID from step 1
#        just secret-gh APP_STORE_CONNECT_API_KEY_P8   the full contents of the downloaded .p8 file
#        just secret-gh APPLE_TEAM_ID                  the Team ID from step 2
#   4. In App Store Connect, create the app (bundle id ch.whoislying.imposter) once by hand — the very first
#      app record can't be created by API. After that this workflow can upload every build.
#   5. Xcode Cloud/manual signing isn't used: -allowProvisioningUpdates lets xcodebuild fetch or create the
#      signing certificate and provisioning profile itself from the API key, the same as Xcode's "Automatically
#      manage signing". The team comes from APPLE_TEAM_ID (the Xcode project has none checked in).
#
# Versions: the build number is the run number, the marketing version is package.json's version (the same as
# the Android workflow), both passed as build settings, so nothing in ios/ needs editing per release.
#
#   6. Set the repository variable IOS_SIGNING_READY=true: `gh variable set IOS_SIGNING_READY --body true`.
# Until then every run builds unsigned (proving the native project is sound) and skips signing and the upload,
# so it's safe to run, and to start after every release, before the Apple side is ready.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Where to send the build"
        type: choice
        options: [testflight]
        default: testflight

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the native iOS project (Capacitor)
        run: npx cap sync ios

      - name: Build only, unsigned (no Apple signing set up yet — proves the native project builds)
        if: vars.IOS_SIGNING_READY != 'true'
        run: |
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO

      - name: Install the App Store Connect API key
        if: vars.IOS_SIGNING_READY == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive
        if: vars.IOS_SIGNING_READY == 'true'
        # Capacitor's Swift Package Manager project: App.xcodeproj, no CocoaPods workspace.
        # App Store Connect rejects a re-used build number (the run number always goes up) and closes a
        # marketing version once it is released (package.json's version moves on with every web release).
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version=$(node -p "require('./package.json').version")
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$version"

      - name: Write the export options
        if: vars.IOS_SIGNING_READY == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export the .ipa
        if: vars.IOS_SIGNING_READY == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        if: vars.IOS_SIGNING_READY == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find build/ipa -name "*.ipa" -print -quit)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up the signing key
        if: always() && vars.IOS_SIGNING_READY == 'true'
        run: rm -rf ~/private_keys
