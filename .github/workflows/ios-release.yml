name: iOS release (TestFlight)

# Builds and uploads the Capacitor iOS app to TestFlight on GitHub's own macOS runner (Xcode included) —
# nothing to install locally. Manual trigger only: this costs macOS build minutes and touches App Store Connect.
#
# One-time setup (Apple Developer Program membership required, https://developer.apple.com/programs/):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API → generate a key with the
#      "App Manager" role. Note the Key ID and Issuer ID, and download the .p8 file (shown only once).
#   2. Apple Developer → Membership → find your 10-character Team ID.
#   3. In this repo: Settings → Secrets and variables → Actions, add:
#        APP_STORE_CONNECT_KEY_ID       the Key ID from step 1
#        APP_STORE_CONNECT_ISSUER_ID    the Issuer ID from step 1
#        APP_STORE_CONNECT_API_KEY_P8   the full contents of the downloaded .p8 file
#        APPLE_TEAM_ID                  the Team ID from step 2
#   4. In App Store Connect, create the app (bundle id ch.whoislying.imposter) once by hand — the very first
#      app record can't be created by API. After that this workflow can upload every build.
#   5. Xcode Cloud/manual signing isn't used: -allowProvisioningUpdates lets xcodebuild fetch or create the
#      signing certificate and provisioning profile itself from the API key, the same as Xcode's "Automatically
#      manage signing".
#
# Until the secrets above exist, "Run workflow" fails fast with a clear message instead of a cryptic build error.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Where to send the build"
        type: choice
        options: [testflight]
        default: testflight

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check required secrets are set
        run: |
          missing=()
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. See the setup steps at the top of .github/workflows/ios-release.yml."
            exit 1
          fi
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the native iOS project (Capacitor)
        run: npx cap sync ios

      - name: Install the App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Bump the build number
        # App Store Connect rejects a re-used build number: the run number always goes up. The marketing
        # version (1.0, 2.3, …) stays whatever Xcode project has; bump it by hand for a real version bump.
        run: |
          cd ios/App
          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"

      - name: Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Write the export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export the .ipa
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find build/ipa -name "*.ipa" -print -quit)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up the signing key
        if: always()
        run: rm -rf ~/private_keys
