<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Imposter</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b132b; color: #e2fffb; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { color: #6fffe9; margin: 0 0 8px; }
    button { margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 999px; background: #5bc0be; color: #0b132b; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <!-- only shown on a very first launch without internet; afterwards the app works offline from its cache -->
  <main>
    <h1>Imposter</h1>
    <p>Connect to the internet once to load the game. After that, one-phone games work offline.</p>
    <button onclick="location.href='https://whoislying.ch'">Try again</button>
  </main>
</body>
</html>
